# Global platform config. Copy to config/platform.yaml and adjust.
# Keys are camelCase to match the zod schema (src/config/schema/platform.ts) 1:1.
dataDir: ./data
dbPath: ./data/orchestrator.db
reposDir: ./config/repos
workspacesDir: ./data/workspaces
defaultLanguage: en
logLevel: info
reconciler:
  onStart: true
  everyHours: 6
github:
  appId: "123456"
  privateKeyPath: ./secrets/github-app.pem
  webhookSecretEnv: GITHUB_WEBHOOK_SECRET

# Named runner profiles: switch the review client (runner + model + effort) by one name.
# A repo selects its active profile with `runner.profile: <name>` (config/repos/<r>/repo.yaml),
# or with `npm run cli -- runner use <name> --repo <owner/repo>`.
#
# LEAVE THIS KEY OUT unless you need a client the built-ins do not cover. Setting it REPLACES the
# built-in starter profiles wholesale (a zod `.default()` applies only when the key is absent) —
# it does not merge. A copied block therefore freezes at the day you copied it: every profile added
# to previewer afterwards stops reaching you, and a repo.yaml pointing at one fails at startup with
# `Unknown runner profile`. Run `npm run cli -- runner list` to see the profiles you actually have.
#
# If you do set it, restate the built-ins you still want alongside your own — see
# DEFAULT_RUNNER_PROFILES in src/config/schema/runner.ts for their current definitions.
#
# runnerProfiles:
#   my-client:
#     runner: codex-cli        # a registered runner id (claude-cli, codex-cli, anthropic-api)
#     model: gpt-5.6-sol       # optional; omit for the runner's own default
#     reasoningEffort: max     # low | medium | high | xhigh | max (codex clamps at high)
#     description: shown by `runner list`.
