# kourion.fi — a LIVE repo, not a template: the loader skips only `_`/`.`-prefixed dirs, so this
# config is loaded and acted on (tests/fixtures.test.ts pins that). Editing `runner:` here changes
# which vendor receives this repo's source and diffs. For a template to copy, see `_example/`.
repo:
  id: NickShtefan/kourion.fi
  enabled: true
  defaultBranch: main
events:
  triggers: [ opened, reopened, synchronize, ready_for_review ]
  ignoreDraft: true
  ignorePaths: [ "**/*.lock", "**/dist/**", "**/node_modules/**" ]
review:
  defaultProfile: security-baseline
  incremental: true
  depthPolicy: risk_aware
  maxTokensPerRun: 120000
runner:
  policy: cost_first
  overrides: [] # one client for everything — no per-size routing
  profile: opus5-max
publish:
  mode: single_top_level_comment
  formalReview: false
  includeHeadSha: true
  upsert: per_head_sha
context:
  source: hybrid
  packRef: context-pack@v1
security:
  baseline: default
  extra:
    - "Wallet addresses, portfolio contents, and analytics payloads are
      sensitive even when not classic PII."
    - "Any new public endpoint is a possible data-exfiltration surface."
