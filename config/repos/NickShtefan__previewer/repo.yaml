# Generated by onboarding (M8). Edit freely.
repo:
  id: NickShtefan/previewer
  enabled: true
  defaultBranch: main
review:
  defaultProfile: security-baseline
  incremental: true
runner:
  # Opus 5 at max effort; mirrors kourion. Claude models can drift off the strict JSON envelope
  # (Fable did) — src/runners/cli/claude.ts retries on drift up to `maxParseAttempts` (3), so this
  # repo depends on that path. Each attempt re-runs the WHOLE review, not just the parse: a drift
  # that survives them costs up to three full agentic passes with nothing posted.
  # Switch per-repo with: npm run cli -- runner use <profile> --repo NickShtefan/previewer
  policy: cost_first
  profile: opus5-max
context:
  source: hybrid
  packRef: context-pack@v1
